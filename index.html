<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル共有ホワイトボード</title>
  <!-- PDF読み込み用ライブラリ PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }

    /* ツールバー */
    #toolbar {
      height: 54px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #475569;
      padding-right: 10px;
    }
    .tool-group:last-child { border-right: none; }
    label { font-size: 13px; font-weight: bold; white-space: nowrap; }
    button, select, input[type="file"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #64748b;
      background: #334155;
      color: white;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    button.active {
      background: #2563eb !important;
      border-color: #60a5fa !important;
    }
    button.danger {
      background: #dc2626;
      border-color: #ef4444;
    }

    /* メイン領域 */
    #board-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #cbd5e1;
    }

    /* 移動・ピン留め・トリミングできる資料枠 */
    #doc-wrapper {
      position: absolute;
      top: 40px;
      left: 40px;
      display: none;
      z-index: 5;
      cursor: grab;
      border: 2px dashed rgba(71, 85, 105, 0.4);
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      resize: both;
      overflow: hidden;
      min-width: 150px;
      min-height: 150px;
      max-width: 90%;
      max-height: 90%;
    }
    #doc-wrapper:active { cursor: grabbing; }
    #doc-wrapper.pinned {
      cursor: default;
      border: 2px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      resize: none;
    }

    /* 資料上部の操作ボタンバー */
    .doc-controls {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      z-index: 25;
      pointer-events: none;
    }
    .doc-btn-group {
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }
    .doc-controls button {
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .doc-controls button.is-pinned {
      background: #dc2626;
    }
    .doc-controls button.del-doc {
      background: rgba(220, 38, 38, 0.85);
    }

    #background-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* トリミング用オーバーレイ */
    #crop-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: none;
      cursor: crosshair;
    }
    #crop-box {
      position: absolute;
      border: 2px dashed #2563eb;
      background: rgba(37, 99, 235, 0.15);
      display: none;
    }

    /* ペン描画キャンバス */
    #drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* 範囲クリア用の点線枠 */
    #selection-box {
      position: absolute;
      border: 2px dashed #ef4444;
      background: rgba(239, 68, 68, 0.15);
      display: none;
      z-index: 15;
      pointer-events: none;
    }

    /* 付箋スタイル */
    .sticky-note {
      position: absolute;
      width: 180px;
      min-width: 120px;
      height: 100px;
      min-height: 60px;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.15);
      z-index: 30;
      cursor: grab;
      display: flex;
      flex-direction: column;
      resize: both;
      overflow: hidden;
      font-family: inherit;
    }
    .sticky-note:active { cursor: grabbing; }
    .sticky-note textarea {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      color: #1e293b;
      user-select: text;
    }
    .sticky-note .del-btn {
      align-self: flex-end;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      line-height: 1;
    }
    .sticky-note .del-btn:hover { color: #ef4444; }

    /* 付箋カラー */
    .color-pink   { background-color: #ffd1dc; }
    .color-yellow { background-color: #fff9b1; }
    .color-blue   { background-color: #cce5ff; }
    .color-green  { background-color: #d9f99d; }
    .color-white  { background-color: #ffffff; }

    /* 下部テキストマイニング集計 */
    #mining-panel {
      height: 90px;
      background: #ffffff;
      border-top: 2px solid #cbd5e1;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      z-index: 50;
      flex-shrink: 0;
    }
    #mining-panel h4 {
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
    }
    #word-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow-y: auto;
    }
    .word-badge {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .word-badge span {
      background: #3b82f6;
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      margin-left: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <div id="toolbar">
    <!-- 資料配置 -->
    <div class="tool-group">
      <label>資料:</label>
      <input type="file" id="fileInput" accept="image/*,.pdf">
      <button onclick="resetDocPosition()" title="初期位置・サイズに戻す">位置リセット</button>
    </div>

    <!-- 付箋追加 -->
    <div class="tool-group">
      <label>付箋:</label>
      <select id="noteColor">
        <option value="pink">薄いピンク</option>
        <option value="yellow" selected>黄色</option>
        <option value="blue">水色</option>
        <option value="green">薄い黄緑</option>
        <option value="white">白</option>
      </select>
      <button onclick="addStickyNote()">＋ 付箋</button>
    </div>

    <!-- ペン・描画操作 -->
    <div class="tool-group">
      <label>描画:</label>
      <button id="penBtn" onclick="setMode('pen')">ペン: OFF</button>
      <select id="penColor">
        <option value="#e53e3e">赤</option>
        <option value="#3182ce">青</option>
      </select>
      <select id="penWidth">
        <option value="2">細い (2px)</option>
        <option value="6">太い (6px)</option>
      </select>
    </div>

    <!-- 消しゴム & 範囲クリア機能 -->
    <div class="tool-group">
      <button id="eraserBtn" onclick="setMode('eraser')">消しゴム</button>
      <button id="selectClearBtn" onclick="setMode('selectClear')">範囲クリア</button>
      <button onclick="clearCanvas()" class="danger">全消去</button>
    </div>
  </div>

  <!-- ボード領域 -->
  <div id="board-container">
    <!-- 資料枠 -->
    <div id="doc-wrapper">
      <div class="doc-controls">
        <div class="doc-btn-group">
          <button id="pinBtn" onclick="togglePinDoc(event)">📌 ピン留め</button>
          <button id="cropToggleBtn" onclick="startCrop(event)">✂️ 切り抜き</button>
        </div>
        <div class="doc-btn-group">
          <button class="del-doc" onclick="deleteDoc(event)">🗑️ 削除</button>
        </div>
      </div>
      <img id="background-img" alt="">
      <!-- トリミング枠 -->
      <div id="crop-layer">
        <div id="crop-box"></div>
      </div>
    </div>

    <!-- 描画キャンバス -->
    <canvas id="drawing-canvas"></canvas>
    <!-- 範囲クリア用四角枠 -->
    <div id="selection-box"></div>
  </div>

  <!-- 下部テキストマイニング -->
  <div id="mining-panel">
    <h4>📊 みんなのコメント頻出キーワード（自動集計）</h4>
    <div id="word-tags">
      <span style="color:#94a3b8; font-size:12px;">付箋に文字が入力されると、ここに頻出ワードが集計されます</span>
    </div>
  </div>

  <script>
    const board = document.getElementById('board-container');
    const docWrapper = document.getElementById('doc-wrapper');
    const backgroundImg = document.getElementById('background-img');
    const pinBtn = document.getElementById('pinBtn');
    let isDocPinned = false;
    let originalImageSrc = ''; // トリミング前の元データ

    // PDF.jsのWorker設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // --- 1. 資料の読み込み（画像 & PDF対応） ---
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type === 'application/pdf') {
        const fileReader = new FileReader();
        fileReader.onload = async function() {
          const typedarray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          const page = await pdf.getPage(1); // 1ページ目をレンダリング
          const viewport = page.getViewport({ scale: 1.5 });
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = viewport.width;
          tempCanvas.height = viewport.height;
          await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;
          setupDoc(tempCanvas.toDataURL('image/png'));
        };
        fileReader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = (event) => setupDoc(event.target.result);
        reader.readAsDataURL(file);
      }
    });

    function setupDoc(src) {
      originalImageSrc = src;
      backgroundImg.src = src;
      docWrapper.style.display = 'block';
      docWrapper.style.left = '40px';
      docWrapper.style.top = '40px';
      docWrapper.style.width = '440px';
      docWrapper.style.height = 'auto';
      isDocPinned = false;
      docWrapper.classList.remove('pinned');
      pinBtn.classList.remove('is-pinned');
      pinBtn.textContent = '📌 ピン留め';
    }

    // ③ 資料の削除機能
    function deleteDoc(e) {
      e.stopPropagation();
      if (!confirm('挿入した資料を削除しますか？')) return;
      docWrapper.style.display = 'none';
      backgroundImg.src = '';
      originalImageSrc = '';
      fileInput.value = '';
    }

    // ピン留め切り替え
    function togglePinDoc(e) {
      e.stopPropagation();
      isDocPinned = !isDocPinned;
      if (isDocPinned) {
        docWrapper.classList.add('pinned');
        pinBtn.classList.add('is-pinned');
        pinBtn.textContent = '🔒 ピン留め中';
      } else {
        docWrapper.classList.remove('pinned');
        pinBtn.classList.remove('is-pinned');
        pinBtn.textContent = '📌 ピン留め';
      }
    }

    function resetDocPosition() {
      if (docWrapper.style.display !== 'none') {
        docWrapper.style.left = '40px';
        docWrapper.style.top = '40px';
        docWrapper.style.width = '440px';
        docWrapper.style.height = 'auto';
      }
    }

    // ④ 資料のトリミング（切り抜き）機能
    const cropLayer = document.getElementById('crop-layer');
    const cropBox = document.getElementById('crop-box');
    const cropToggleBtn = document.getElementById('cropToggleBtn');
    let isCropping = false;
    let cropStartX = 0, cropStartY = 0;

    function startCrop(e) {
      e.stopPropagation();
      if (isCropping) {
        finishCrop();
        return;
      }
      isCropping = true;
      cropToggleBtn.textContent = '確定 (適用)';
      cropToggleBtn.style.background = '#2563eb';
      cropLayer.style.display = 'block';
    }

    cropLayer.addEventListener('mousedown', (e) => {
      const rect = cropLayer.getBoundingClientRect();
      cropStartX = e.clientX - rect.left;
      cropStartY = e.clientY - rect.top;
      cropBox.style.left = cropStartX + 'px';
      cropBox.style.top = cropStartY + 'px';
      cropBox.style.width = '0px';
      cropBox.style.height = '0px';
      cropBox.style.display = 'block';

      function onMouseMove(moveEvent) {
        const curX = moveEvent.clientX - rect.left;
        const curY = moveEvent.clientY - rect.top;
        cropBox.style.left = Math.min(cropStartX, curX) + 'px';
        cropBox.style.top = Math.min(cropStartY, curY) + 'px';
        cropBox.style.width = Math.abs(curX - cropStartX) + 'px';
        cropBox.style.height = Math.abs(curY - cropStartY) + 'px';
      }

      function onMouseUp() {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    function finishCrop() {
      const boxW = cropBox.offsetWidth;
      const boxH = cropBox.offsetHeight;
      if (boxW > 20 && boxH > 20) {
        // 表示サイズと画像元解像度の比率を計算して切り抜く
        const scaleX = backgroundImg.naturalWidth / backgroundImg.clientWidth;
        const scaleY = backgroundImg.naturalHeight / backgroundImg.clientHeight;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = boxW * scaleX;
        cropCanvas.height = boxH * scaleY;
        const cCtx = cropCanvas.getContext('2d');

        cCtx.drawImage(
          backgroundImg,
          cropBox.offsetLeft * scaleX,
          cropBox.offsetTop * scaleY,
          boxW * scaleX,
          boxH * scaleY,
          0, 0, cropCanvas.width, cropCanvas.height
        );

        backgroundImg.src = cropCanvas.toDataURL();
      }

      cropBox.style.display = 'none';
      cropLayer.style.display = 'none';
      isCropping = false;
      cropToggleBtn.textContent = '✂️ 切り抜き';
      cropToggleBtn.style.background = 'rgba(30, 41, 59, 0.85)';
    }

    // 資料枠のドラッグ移動
    makeElementDraggable(docWrapper, () => isDocPinned || isCropping);

    function makeElementDraggable(el, isLockedFn = () => false) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      el.addEventListener('mousedown', (e) => {
        if (isLockedFn()) return;
        if (e.target.tagName.toLowerCase() === 'textarea' || e.target.tagName.toLowerCase() === 'button') return;
        const rect = el.getBoundingClientRect();
        if (e.clientX > rect.right - 18 && e.clientY > rect.bottom - 18) return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        el.style.left = `${initialLeft + (e.clientX - startX)}px`;
        el.style.top = `${initialTop + (e.clientY - startY)}px`;
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    // --- 2. 付箋の追加と移動 ---
    function addStickyNote(colorClass, text = '', left = 520, top = 60) {
      const color = colorClass || 'color-' + document.getElementById('noteColor').value;
      const note = document.createElement('div');
      note.className = `sticky-note ${color}`;
      note.style.left = left + 'px';
      note.style.top = top + 'px';

      note.innerHTML = `
        <button class="del-btn" onclick="deleteNote(this)">✕</button>
        <textarea maxlength="100" placeholder="100字以内でコメントを入力...">${text}</textarea>
      `;

      board.appendChild(note);
      const textarea = note.querySelector('textarea');
      textarea.addEventListener('input', runTextMining);
      makeElementDraggable(note);
      runTextMining();
    }

    function deleteNote(btn) {
      btn.parentElement.remove();
      runTextMining();
    }

    // --- 3. 描画モード（ペン・消しゴム・範囲クリア） ---
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    const penBtn = document.getElementById('penBtn');
    const eraserBtn = document.getElementById('eraserBtn');
    const selectClearBtn = document.getElementById('selectClearBtn');
    const selectionBox = document.getElementById('selection-box');

    let currentMode = 'none'; // 'none' | 'pen' | 'eraser' | 'selectClear'
    let isDrawing = false;
    let selStartX = 0, selStartY = 0;

    function resizeCanvas() {
      canvas.width = board.clientWidth;
      canvas.height = board.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setMode(mode) {
      if (currentMode === mode) {
        currentMode = 'none'; // OFFにする
      } else {
        currentMode = mode;
      }

      penBtn.classList.toggle('active', currentMode === 'pen');
      penBtn.textContent = (currentMode === 'pen') ? 'ペン: ON' : 'ペン: OFF';
      eraserBtn.classList.toggle('active', currentMode === 'eraser');
      selectClearBtn.classList.toggle('active', currentMode === 'selectClear');

      if (currentMode === 'pen' || currentMode === 'eraser' || currentMode === 'selectClear') {
        canvas.style.pointerEvents = 'auto';
      } else {
        canvas.style.pointerEvents = 'none';
      }
    }
    canvas.style.pointerEvents = 'none';

    // マウス押下時の処理
    canvas.addEventListener('mousedown', (e) => {
      if (currentMode === 'none') return;

      if (currentMode === 'pen' || currentMode === 'eraser') {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);

        if (currentMode === 'eraser') {
          // ① 消しゴム処理（描画を透過消去）
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 18; // 消しやすいように太め
        } else {
          // ペン処理
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = document.getElementById('penColor').value;
          ctx.lineWidth = parseInt(document.getElementById('penWidth').value, 10);
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      } else if (currentMode === 'selectClear') {
        // ② 描画の選択クリア（範囲指定開始）
        isDrawing = true;
        selStartX = e.clientX;
        selStartY = e.clientY;
        selectionBox.style.left = selStartX + 'px';
        selectionBox.style.top = selStartY + 'px';
        selectionBox.style.width = '0px';
        selectionBox.style.height = '0px';
        selectionBox.style.display = 'block';
      }
    });

    // マウス移動時
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;

      if (currentMode === 'pen' || currentMode === 'eraser') {
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      } else if (currentMode === 'selectClear') {
        const curX = e.clientX;
        const curY = e.clientY;
        selectionBox.style.left = Math.min(selStartX, curX) + 'px';
        selectionBox.style.top = Math.min(selStartY, curY) + 'px';
        selectionBox.style.width = Math.abs(curX - selStartX) + 'px';
        selectionBox.style.height = Math.abs(curY - selStartY) + 'px';
      }
    });

    // マウス離した時
    window.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentMode === 'selectClear') {
        // 指定した四角範囲の線を一気に消去
        const rect = board.getBoundingClientRect();
        const selLeft = Math.min(selStartX, e.clientX) - rect.left;
        const selTop = Math.min(selStartY, e.clientY) - rect.top;
        const selW = Math.abs(e.clientX - selStartX);
        const selH = Math.abs(e.clientY - selStartY);

        if (selW > 5 && selH > 5) {
          ctx.clearRect(selLeft, selTop, selW, selH);
        }
        selectionBox.style.display = 'none';
        setMode('none'); // クリア後に通常モードに戻す
      }
      ctx.globalCompositeOperation = 'source-over';
    });

    function clearCanvas() {
      if (confirm('描いた線をすべて消去しますか？')) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // --- 4. テキストマイニング集計 ---
    const stopWords = new Set([
      'こと','もの','よう','ため','そう','これ','それ','あれ','この','その','あの','どこ','だれ','なに',
      'する','ある','いる','なる','できる','思う','いう','見る','いく','くる','の','に','は','を','た',
      'が','で','て','と','し','れ','さ','から','な','として','ます','です','ない','あった','した','へ','ば'
    ]);

    function runTextMining() {
      const textareas = document.querySelectorAll('.sticky-note textarea');
      let combinedText = '';
      textareas.forEach(t => { combinedText += ' ' + t.value.trim(); });

      const regex = /([\u4e00-\u9faf]+[\u3040-\u309f]{1,2}[\u4e00-\u9faf]+)|([\u4e00-\u9faf]{2,})|([\u4e00-\u9faf])|([\u30a1-\u30f6]{2,})|([A-Za-z]{3,})/g;
      const tokens = combinedText.match(regex) || [];
      const wordCounts = {};

      tokens.forEach(w => {
        if (!stopWords.has(w) && w.length > 0) {
          wordCounts[w] = (wordCounts[w] || 0) + 1;
        }
      });

      const sorted = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const container = document.getElementById('word-tags');
      container.innerHTML = '';

      if (sorted.length === 0) {
        container.innerHTML = '<span style="color:#94a3b8; font-size:12px;">付箋に文字が入力されると、ここに頻出ワードが集計されます</span>';
        return;
      }

      sorted.forEach(([word, count]) => {
        const badge = document.createElement('div');
        badge.className = 'word-badge';
        badge.innerHTML = `${word} <span>${count}</span>`;
        container.appendChild(badge);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      runTextMining();
    });
  </script>
</body>
</html>
