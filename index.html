<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル共有ホワイトボード</title>
  <!-- 本格的な日本語形態素解析ライブラリ Kuromoji.js -->
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }

    /* ツールバー */
    #toolbar {
      height: 54px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
      flex-shrink: 0;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #475569;
      padding-right: 12px;
    }
    .tool-group:last-child { border-right: none; }
    label { font-size: 13px; font-weight: bold; }
    button, select, input[type="file"] {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #64748b;
      background: #334155;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button.active {
      background: #2563eb;
      border-color: #60a5fa;
    }

    /* メイン領域 */
    #board-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #cbd5e1;
    }

    /* 移動・ピン留めできる資料枠 */
    #doc-wrapper {
      position: absolute;
      top: 40px;
      left: 40px;
      display: none;
      z-index: 5;
      cursor: grab;
      border: 2px dashed rgba(71, 85, 105, 0.4);
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      resize: both;
      overflow: hidden;
      min-width: 150px;
      min-height: 150px;
      max-width: 90%;
      max-height: 90%;
    }
    #doc-wrapper:active { cursor: grabbing; }
    #doc-wrapper.pinned {
      cursor: default;
      border: 2px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      resize: none;
    }

    .doc-pin-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 20;
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .doc-pin-btn:hover { opacity: 1; }
    .doc-pin-btn.is-pinned {
      background: #dc2626;
      color: white;
    }

    #doc-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* ペン描画キャンバス */
    #drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* 付箋スタイル（横長デザイン） */
    .sticky-note {
      position: absolute;
      width: 180px;
      min-width: 120px;
      height: 100px;
      min-height: 60px;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.15);
      z-index: 20;
      cursor: grab;
      display: flex;
      flex-direction: column;
      resize: both;
      overflow: hidden;
      font-family: inherit;
    }
    .sticky-note:active { cursor: grabbing; }
    .sticky-note textarea {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      color: #1e293b;
      user-select: text;
    }
    .sticky-note .del-btn {
      align-self: flex-end;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 0 0 2px 0;
      line-height: 1;
    }
    .sticky-note .del-btn:hover { color: #ef4444; }

    /* 付箋の5色 */
    .color-pink   { background-color: #ffd1dc; }
    .color-yellow { background-color: #fff9b1; }
    .color-blue   { background-color: #cce5ff; }
    .color-green  { background-color: #d9f99d; } /* 明るい薄い黄緑 */
    .color-white  { background-color: #ffffff; }

    /* 下部テキストマイニング集計 */
    #mining-panel {
      height: 90px;
      background: #ffffff;
      border-top: 2px solid #cbd5e1;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      z-index: 50;
      flex-shrink: 0;
    }
    #mining-panel h4 {
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #mining-status {
      font-size: 11px;
      color: #94a3b8;
      font-weight: normal;
    }
    #word-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow-y: auto;
    }
    .word-badge {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .word-badge span {
      background: #3b82f6;
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      margin-left: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- 操作ツールバー -->
  <div id="toolbar">
    <!-- 資料貼り付け -->
    <div class="tool-group">
      <label>資料(画像):</label>
      <input type="file" id="fileInput" accept="image/*,.pdf">
      <button onclick="resetDocPosition()" title="初期位置・サイズに戻す">位置リセット</button>
    </div>

    <!-- 付箋追加 -->
    <div class="tool-group">
      <label>付箋追加:</label>
      <select id="noteColor">
        <option value="pink">薄いピンク</option>
        <option value="yellow" selected>黄色</option>
        <option value="blue">水色</option>
        <option value="green">薄い黄緑</option>
        <option value="white">白</option>
      </select>
      <button onclick="addStickyNote()">＋ 付箋を貼る</button>
    </div>

    <!-- ペン入力 -->
    <div class="tool-group">
      <label>ペン入力:</label>
      <button id="penToggle" onclick="togglePen()">ペン: OFF</button>
      <select id="penColor">
        <option value="#e53e3e">赤</option>
        <option value="#3182ce">青</option>
      </select>
      <select id="penWidth">
        <option value="2">細い (2px)</option>
        <option value="6">太い (6px)</option>
      </select>
      <button onclick="clearCanvas()">描画クリア</button>
    </div>
  </div>

  <!-- ボード領域 -->
  <div id="board-container">
    <div id="doc-wrapper">
      <button class="doc-pin-btn" id="pinBtn" onclick="togglePinDoc(event)">📌 ピン留め</button>
      <img id="background-img" alt="">
    </div>
    <canvas id="drawing-canvas"></canvas>
  </div>

  <!-- テキストマイニング集計 -->
  <div id="mining-panel">
    <h4>
      📊 みんなのコメント頻出キーワード（自動集計）
      <span id="mining-status">（日本語解析エンジン準備中...）</span>
    </h4>
    <div id="word-tags">
      <span style="color:#94a3b8; font-size:12px;">付箋に文字が入力されると、ここに頻出ワードが集計されます</span>
    </div>
  </div>

  <script>
    const board = document.getElementById('board-container');
    const docWrapper = document.getElementById('doc-wrapper');
    const backgroundImg = document.getElementById('background-img');
    const pinBtn = document.getElementById('pinBtn');
    let isDocPinned = false;

    // --- 1. 資料の読み込みと配置 ---
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        backgroundImg.src = event.target.result;
        docWrapper.style.display = 'block';
        docWrapper.style.left = '40px';
        docWrapper.style.top = '40px';
        docWrapper.style.width = '420px';
        docWrapper.style.height = 'auto';
        isDocPinned = false;
        docWrapper.classList.remove('pinned');
        pinBtn.classList.remove('is-pinned');
        pinBtn.textContent = '📌 ピン留め';
      };
      reader.readAsDataURL(file);
    });

    function togglePinDoc(e) {
      e.stopPropagation();
      isDocPinned = !isDocPinned;
      if (isDocPinned) {
        docWrapper.classList.add('pinned');
        pinBtn.classList.add('is-pinned');
        pinBtn.textContent = '🔒 ピン留め中';
      } else {
        docWrapper.classList.remove('pinned');
        pinBtn.classList.remove('is-pinned');
        pinBtn.textContent = '📌 ピン留め';
      }
    }

    function resetDocPosition() {
      if (docWrapper.style.display !== 'none') {
        docWrapper.style.left = '40px';
        docWrapper.style.top = '40px';
        docWrapper.style.width = '420px';
        docWrapper.style.height = 'auto';
      }
    }

    makeElementDraggable(docWrapper, () => isDocPinned);

    function makeElementDraggable(el, isLockedFn = () => false) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      el.addEventListener('mousedown', (e) => {
        if (isLockedFn()) return;
        if (e.target.tagName.toLowerCase() === 'textarea' || e.target.tagName.toLowerCase() === 'button') return;
        
        const rect = el.getBoundingClientRect();
        if (e.clientX > rect.right - 18 && e.clientY > rect.bottom - 18) return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        el.style.left = `${initialLeft + (e.clientX - startX)}px`;
        el.style.top = `${initialTop + (e.clientY - startY)}px`;
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // --- 2. 付箋の追加と移動 ---
    function addStickyNote(colorClass, text = '', left = 500, top = 60) {
      const color = colorClass || 'color-' + document.getElementById('noteColor').value;
      const note = document.createElement('div');
      note.className = `sticky-note ${color}`;
      note.style.left = left + 'px';
      note.style.top = top + 'px';

      note.innerHTML = `
        <button class="del-btn" onclick="deleteNote(this)">✕</button>
        <textarea maxlength="100" placeholder="100字以内でコメントを入力...">${text}</textarea>
      `;

      board.appendChild(note);

      const textarea = note.querySelector('textarea');
      textarea.addEventListener('input', runTextMining);

      makeElementDraggable(note);
      runTextMining();
    }

    function deleteNote(btn) {
      btn.parentElement.remove();
      runTextMining();
    }

    // --- 3. ペン入力機能 ---
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penActive = false;

    function resizeCanvas() {
      canvas.width = board.clientWidth;
      canvas.height = board.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function togglePen() {
      penActive = !penActive;
      const btn = document.getElementById('penToggle');
      if (penActive) {
        btn.textContent = 'ペン: ON';
        btn.classList.add('active');
        canvas.style.pointerEvents = 'auto';
      } else {
        btn.textContent = 'ペン: OFF';
        btn.classList.remove('active');
        canvas.style.pointerEvents = 'none';
      }
    }
    canvas.style.pointerEvents = 'none';

    canvas.addEventListener('mousedown', (e) => {
      if (!penActive) return;
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
      ctx.strokeStyle = document.getElementById('penColor').value;
      ctx.lineWidth = parseInt(document.getElementById('penWidth').value, 10);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !penActive) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });

    window.addEventListener('mouseup', () => { isDrawing = false; });
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // --- 4. 本格形態素解析（Kuromoji.js）によるテキストマイニング ---
    let kuromojiTokenizer = null;
    const statusEl = document.getElementById('mining-status');

    // Kuromoji の辞書を読み込み
    kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict" }).build((err, tokenizer) => {
      if (err) {
        console.error("Kuromoji初期化失敗:", err);
        statusEl.textContent = "（簡易解析モード）";
      } else {
        kuromojiTokenizer = tokenizer;
        statusEl.textContent = "（高精度解析ON）";
        runTextMining(); // 辞書ロード後に再集計
      }
    });

    // 除外する一般的な語句（ストップワード）
    const stopWords = new Set([
      'こと','もの','よう','ため','そう','これ','それ','あれ','この','その','あの','どこ','だれ','なに',
      'する','ある','いる','なる','できる','思う','いう','見る','いく','くる'
    ]);

    function runTextMining() {
      const textareas = document.querySelectorAll('.sticky-note textarea');
      let combinedText = '';
      textareas.forEach(t => { combinedText += ' ' + t.value.trim(); });

      const wordCounts = {};

      if (kuromojiTokenizer) {
        // Kuromojiによる品詞分析
        const tokens = kuromojiTokenizer.tokenize(combinedText);

        tokens.forEach(token => {
          const pos = token.pos;          // 品詞（名詞、形容詞、動詞など）
          const posDetail = token.pos_detail_1; // 品詞細分類
          const basic = token.basic_form !== '*' ? token.basic_form : token.surface_form;

          // 対象: 「一般名詞」「固有名詞」「サ変接続名詞」「形容詞（自立）」
          // 非自立語・接尾辞・助詞・代名詞・数詞・記号などは除外
          const isTargetNoun = (pos === '名詞' && (posDetail === '一般' || posDetail === '固有名詞' || posDetail === 'サ変接続'));
          const isTargetAdj = (pos === '形容詞' && posDetail === '自立');

          if (isTargetNoun || isTargetAdj) {
            // 1文字のひらがな・記号や除外語をフィルタ
            if (!stopWords.has(basic) && basic.length >= 1 && !/^[\u3040-\u309f]$/.test(basic)) {
              wordCounts[basic] = (wordCounts[basic] || 0) + 1;
            }
          }
        });
      } else {
        // 辞書ロード前やフォールバック時の処理
        const tokens = combinedText.match(/[\u4e00-\u9faf]{1,}|[\u30a1-\u30f6]{2,}|[A-Za-z]{3,}/g) || [];
        tokens.forEach(w => {
          if (!stopWords.has(w)) wordCounts[w] = (wordCounts[w] || 0) + 1;
        });
      }

      // 出現頻度順にソート（上位8件）
      const sorted = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const container = document.getElementById('word-tags');
      container.innerHTML = '';

      if (sorted.length === 0) {
        container.innerHTML = '<span style="color:#94a3b8; font-size:12px;">付箋に文字が入力されると、ここに頻出ワードが集計されます</span>';
        return;
      }

      sorted.forEach(([word, count]) => {
        const badge = document.createElement('div');
        badge.className = 'word-badge';
        badge.innerHTML = `${word} <span>${count}</span>`;
        container.appendChild(badge);
      });
    }
  </script>
</body>
</html>
